name: Finalize project upload

on:
  push:
    branches: [main]
    paths:
      - ".upload-parts/**"

permissions:
  contents: write

jobs:
  reassemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload-parts/part-* > .upload-parts/project.tar.gz
          expected="$(cat .upload-parts/archive.sha256)"
          actual="$(sha256sum .upload-parts/project.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$expected"
          tar -xzf .upload-parts/project.tar.gz -C .

      - name: Commit restored project files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-files | wc -l)" -ge 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .upload-parts
          git add --all
          git commit -m "Upload complete Smart Home Hub project"
          git push
